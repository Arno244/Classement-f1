<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement pilotes F1 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#15151e;--mut:#6b6b78;--line:#e4e4ea;--acc:#e10600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}}
:root[data-theme="dark"]{--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--acc)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:12px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pos{font-weight:700;font-size:16px;text-align:center}
.name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.team{color:var(--mut);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.pts{text-align:right;font-weight:700;font-size:18px}
.gap{color:var(--mut);font-size:11px;font-weight:400;display:block}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 13px/1.2 system-ui,sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.race{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rd{color:var(--mut);font-weight:700;font-size:13px;text-align:center}
.gp{font-weight:600;font-size:15px}
.dt{color:var(--mut);font-size:12px}
.win{text-align:right;font-size:14px;font-weight:600}
.win small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.next{cursor:pointer}
.next.open .chev{transform:rotate(180deg)}
#cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:-4px 0 12px}
.crow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow b{font-weight:600}
.crow small{display:block;color:var(--mut);font-size:11px}
.crow .d{color:var(--mut);font-size:12px;text-align:right}
.crow.done .d::after{content:" ✓"}
.crow.nx{color:var(--acc)}
.crow.nx .d{color:var(--acc);font-weight:700}
.race{cursor:pointer}
.chev{color:var(--mut);font-size:11px;margin-left:4px;display:inline-block;transition:transform .2s}
.race.open .chev{transform:rotate(180deg)}
.det{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.race.open .det{display:block}
.rr{display:grid;grid-template-columns:26px 12px 1fr auto;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.rp{color:var(--mut);font-weight:700;text-align:right}
.rt{color:var(--mut);font-size:12px}
.nodet,.note{color:var(--mut);font-size:12px}
.note{margin-top:6px}
.foot{color:var(--mut);font-size:12px;margin:14px 0 6px;text-align:center}
.drv{cursor:pointer}
.dh{grid-column:1/-1;display:none;border-top:1px solid var(--line);padding-top:10px;margin-top:2px;cursor:default}
.drv.open .dh{display:block}
.drv.open .chev{transform:rotate(180deg)}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:64px;height:64px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.dn{font-weight:700;font-size:16px}
.ds{color:var(--mut);font-size:12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.st div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut)}
.st b{display:block;font-size:18px;color:var(--tx)}
.chs{display:flex;flex-wrap:wrap;gap:5px}
.ch{min-width:44px;text-align:center;background:var(--bg);border-radius:8px;padding:4px 5px;font-size:13px;font-weight:700}
.ch i{display:block;font-style:normal;font-size:9px;color:var(--mut);font-weight:600}
.ch.w{background:#f2c200;color:#15151e}.ch.w i{color:#15151e}
.ch.p{background:#aeb4c0;color:#15151e}.ch.p i{color:#15151e}
.ch.x{background:#c0261b;color:#fff}.ch.x i{color:#fff}
.ch.n{opacity:.4}
.lg{color:var(--mut);font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>🏁 Classement pilotes <span>F1 2026</span></h1>
<p class="sub" id="sub"></p>
<div class="next" id="nextbox"><span>Prochain GP : <b id="nx"></b> <span class="chev">▼</span></span><span id="nd"></span></div>
<div id="cal" hidden></div>
<div class="tabs"><button id="t1" class="on">Classement pilotes</button><button id="t2">Courses</button><button id="t3">Classement constructeurs</button></div>
<div id="v1"><input id="q" type="search" placeholder="Rechercher un pilote ou une écurie…">
<div id="list"></div></div>
<div id="v2" hidden><div id="races"></div></div>
<div id="v3" hidden><div id="cons"></div></div>
<p class="foot">Chargement des données en direct…</p>
<script>
const OPEN=new Set();
/* v3 : mise à jour automatique via API Jolpica */
const $=id=>document.getElementById(id);
let UP=[["Singapour","11 oct."],["États-Unis (Austin)","25 oct."],["Mexique","1 nov."],["Brésil","8 nov."],["Las Vegas","21 nov."],["Qatar","29 nov."],["Abu Dhabi","6 déc."]];
let DATA={
  round:16, total:23, after:"Grand Prix de Bahreïn (Sepang)", date:"4 octobre 2026",
  next:"Singapour", nextDate:"11 octobre 2026",
  drivers:[
    ["Kimi Antonelli","Mercedes",320],["George Russell","Mercedes",236],
    ["Lewis Hamilton","Ferrari",214],["Charles Leclerc","Ferrari",191],
    ["Lando Norris","McLaren",188],["Max Verstappen","Red Bull",188],
    ["Oscar Piastri","McLaren",128],["Isack Hadjar","Red Bull",96],
    ["Liam Lawson","Racing Bulls",65],["Pierre Gasly","Alpine",41],
    ["Arvid Lindblad","Racing Bulls",38],["Franco Colapinto","Alpine",27],
    ["Oliver Bearman","Haas",20],["Gabriel Bortoleto","Audi",10],
    ["Nico Hülkenberg","Audi",7],["Esteban Ocon","Haas",7],
    ["Fernando Alonso","Aston Martin",7],["Carlos Sainz","Williams",7],
    ["Alex Albon","Williams",5],["Yuki Tsunoda","Racing Bulls",1],
    ["Lance Stroll","Aston Martin",0],["Valtteri Bottas","Cadillac",0],
    ["Sergio Pérez","Cadillac",0]
  ]
};
const COL={"Mercedes":"#27f4d2","Ferrari":"#e8002d","McLaren":"#ff8000","Red Bull":"#3671c6","Racing Bulls":"#6692ff","Alpine":"#ff87bc","Haas":"#b6babd","Audi":"#c0392b","Aston Martin":"#229971","Williams":"#64c4ff","Cadillac":"#8a8a99"};
let RACES=[
["Australie","8 mars","George Russell","Mercedes"],["Chine","15 mars","Kimi Antonelli","Mercedes"],
["Japon","29 mars","Kimi Antonelli","Mercedes"],["Miami","3 mai","Kimi Antonelli","Mercedes"],
["Canada","24 mai","Kimi Antonelli","Mercedes"],["Monaco","7 juin","Kimi Antonelli","Mercedes"],
["Barcelone-Catalogne","14 juin","Lewis Hamilton","Ferrari"],["Autriche","28 juin","George Russell","Mercedes"],
["Grande-Bretagne","5 juil.","Charles Leclerc","Ferrari"],["Belgique","19 juil.","Kimi Antonelli","Mercedes"],
["Hongrie","26 juil.","Lando Norris","McLaren"],["Pays-Bas","23 août","Lando Norris","McLaren"],
["Italie","6 sept.","Kimi Antonelli","Mercedes"],["Espagne","13 sept.","Kimi Antonelli","Mercedes"],
["Azerbaïdjan","26 sept.","George Russell","Mercedes"],["Bahreïn (Sepang)","4 oct.","Max Verstappen","Red Bull"]
];
const N={ANT:"Kimi Antonelli",RUS:"George Russell",HAM:"Lewis Hamilton",LEC:"Charles Leclerc",NOR:"Lando Norris",VER:"Max Verstappen",PIA:"Oscar Piastri",HAD:"Isack Hadjar",LAW:"Liam Lawson",GAS:"Pierre Gasly",LIN:"Arvid Lindblad",COL:"Franco Colapinto",BEA:"Oliver Bearman",BOR:"Gabriel Bortoleto",HUL:"Nico Hülkenberg",OCO:"Esteban Ocon",ALO:"Fernando Alonso",SAI:"Carlos Sainz",ALB:"Alex Albon",STR:"Lance Stroll",BOT:"Valtteri Bottas",PER:"Sergio Pérez",TSU:"Yuki Tsunoda"};
const TEAM={};DATA.drivers.forEach(d=>TEAM[d[0]]=d[1]);
let RES=[
"RUS ANT LEC HAM NOR VER BEA LIN BOR GAS OCO ALB LAW COL SAI PER STR | ALO BOT HAD PIA HUL",
"ANT RUS HAM LEC BEA GAS LAW HAD SAI COL HUL LIN BOT OCO PER | VER ALO STR NOR BOR ALB PIA",
"ANT PIA LEC RUS NOR HAM GAS VER LAW OCO HUL HAD BOR LIN SAI COL PER ALO BOT ALB | STR BEA",
"ANT NOR PIA RUS VER HAM COL LEC SAI ALB BEA BOR OCO LIN ALO PER STR BOT | HUL LAW GAS HAD",
"ANT HAM VER LEC HAD COL LAW GAS SAI BEA PIA HUL BOR OCO STR BOT | PER NOR RUS ALO ALB LIN",
"ANT HAM HAD PIA LAW LIN GAS ALB OCO ALO BOR RUS HUL COL PER | SAI LEC STR NOR BEA BOT VER",
"HAM RUS NOR VER PIA HAD GAS LAW LIN COL BOR SAI OCO PER LEC | ANT BEA ALB ALO HUL BOT STR",
"RUS VER ANT PIA HAM HAD NOR LEC LAW LIN BOR HUL GAS BEA COL OCO ALB ALO | STR SAI PER BOT",
"LEC RUS HAM NOR HAD LAW LIN BOR COL GAS PIA BEA OCO PER ANT BOT SAI ALO STR | VER ALB HUL",
"ANT LEC VER HAM PIA HAD NOR BOR LIN COL GAS LAW HUL BEA ALB SAI OCO BOT ALO | STR PER RUS",
"NOR VER ANT LEC HAM HAD RUS LAW HUL LIN BOR GAS STR ALO COL OCO ALB SAI BEA | PIA PER BOT",
"NOR ANT RUS HAM LEC PIA LAW HUL ALO GAS TSU LIN BOR COL PER SAI ALB | BOT OCO STR BEA VER",
"ANT RUS VER NOR PIA HAM GAS LIN COL TSU BOR HUL SAI LAW BEA OCO ALB PER BOT | STR ALO LEC",
"ANT VER NOR LEC RUS LAW COL PIA LIN HUL OCO BOR GAS TSU ALB BEA ALO BOT | SAI PER STR HAM",
"RUS VER HAD LEC ANT HAM LIN OCO BEA SAI HUL LAW BOR PIA PER BOT | COL GAS NOR ALB ALO STR",
"VER ANT HAM LEC HAD PIA LAW ALO NOR LIN HUL STR COL BEA OCO GAS SAI BOR PER RUS | ALB BOT"
];
const P="Classement provisoire : les pénalités de dernière minute peuvent ne pas être incluses.";
const NOTE={9:P,12:P,13:P};

/* Noms français des Grands Prix, par numéro de manche (utilisé pour les données en direct) */
const FR=["","Australie","Chine","Japon","Miami","Canada","Monaco","Barcelone-Catalogne","Autriche","Grande-Bretagne","Belgique","Hongrie","Pays-Bas","Italie","Espagne","Azerbaïdjan","Bahreïn (Sepang)","Singapour","États-Unis (Austin)","Mexique","Brésil","Las Vegas","Qatar","Abu Dhabi"];
const TALIAS={"RB F1 Team":"Racing Bulls","Red Bull Racing":"Red Bull","Haas F1 Team":"Haas","Alpine F1 Team":"Alpine","Cadillac F1 Team":"Cadillac","Audi F1 Team":"Audi","Aston Martin F1 Team":"Aston Martin","Williams F1 Team":"Williams","McLaren F1 Team":"McLaren","Scuderia Ferrari":"Ferrari","Mercedes-AMG Petronas":"Mercedes"};
const tname=n=>TALIAS[n]||String(n||"").replace(/ F1 Team$/,"");
let TOTAL=DATA.total;
function render(f){
  const t=(f||"").toLowerCase(),max=DATA.drivers[0][2]||1;
  $("list").innerHTML=DATA.drivers.map((d,i)=>{
    if(t&&!(d[0]+" "+d[1]).toLowerCase().includes(t))return"";
    const c=COL[d[1]]||"#888",gap=i?"−"+(DATA.drivers[0][2]-d[2])+" pts":"Leader";
    return `<div class="row drv${OPEN.has(d[0])?" open":""}" data-n="${d[0]}"><div class="pos">${i+1}</div><div><div class="name"><span class="dot" style="background:${c}"></span>${d[0]}<span class="chev">▼</span></div><div class="team">${d[1]}</div><div class="bar"><i style="width:${d[2]/max*100}%;background:${c}"></i></div></div><div class="pts">${d[2]}<span class="gap">${gap}</span></div><div class="dh">${OPEN.has(d[0])?hist(d[0]):""}</div></div>`;
  }).join("");
}
$("q").addEventListener("input",e=>render(e.target.value));
function detail(i){
  const s=RES[i];
  if(!s)return '<div class="nodet">Classement complet bientôt disponible.</div>';
  const p=s.split("|").map(x=>x.trim().split(" ").filter(Boolean));
  const row=(c,k)=>{const n=N[c]||c,t=TEAM[n]||"",col=COL[t]||"#888";return `<div class="rr"><span class="rp">${k}</span><span class="dot" style="background:${col}"></span><span>${n}</span><span class="rt">${t}</span></div>`};
  return p[0].map((c,k)=>row(c,k+1)).join("")+(p[1]||[]).map(c=>row(c,"—")).join("")+'<div class="note">— : abandon ou non classé</div>'+(NOTE[i]?'<div class="note">'+NOTE[i]+'</div>':"");
}
function build(){
  $("sub").textContent="Après la manche "+DATA.round+"/"+TOTAL+" · "+DATA.after+" · "+DATA.date;
  $("nx").textContent=DATA.next;
  $("nd").textContent=DATA.nextDate;
  render($("q").value);
  const open=[...document.querySelectorAll("#races .race.open")].map(e=>e.dataset.i);
  $("races").innerHTML=RACES.map((r,i)=>{const c=COL[r[3]]||"#888";
  return `<div class="race${open.includes(String(i))?" open":""}" data-i="${i}"><div class="rd">${i+1}</div><div><div class="gp">GP ${r[0]}<span class="chev">▼</span></div><div class="dt">${r[1]} 2026</div></div><div class="win"><span class="dot" style="background:${c};display:inline-block;margin-right:5px"></span>${r[2]}<small>${r[3]}</small></div><div class="det">${detail(i)}</div></div>`}).reverse().join("");
  const T={};DATA.drivers.forEach(d=>T[d[1]]=(T[d[1]]||0)+d[2]);
  const TL=Object.entries(T).sort((a,b)=>b[1]-a[1]);
  $("cons").innerHTML=TL.map((t,i)=>{const c=COL[t[0]]||"#888",gap=i?"−"+(TL[0][1]-t[1])+" pts":"Leader";
  return `<div class="row drv tm${OPEN.has("T:"+t[0])?" open":""}" data-t="${t[0]}"><div class="pos">${i+1}</div><div><div class="name"><span class="dot" style="background:${c}"></span>${t[0]}<span class="chev">▼</span></div><div class="bar"><i style="width:${t[1]/TL[0][1]*100}%;background:${c}"></i></div></div><div class="pts">${t[1]}<span class="gap">${gap}</span></div><div class="dh">${OPEN.has("T:"+t[0])?thist(t[0]):""}</div></div>`}).join("");
  $("cal").innerHTML=RACES.map((r,i)=>`<div class="crow done"><span class="rp">${i+1}</span><div><b>GP ${r[0]}</b><small>Vainqueur : ${r[2]}</small></div><span class="d">${r[1]}</span></div>`).join("")+UP.map((u,i)=>`<div class="crow${i?"":" nx"}"><span class="rp">${RACES.length+i+1}</span><div><b>GP ${u[0]}</b><small>${i?"À venir":"Prochain Grand Prix"}</small></div><span class="d">${u[1]}</span></div>`).join("");
}
$("races").addEventListener("click",e=>{const r=e.target.closest(".race");if(r)r.classList.toggle("open")});
$("nextbox").onclick=function(){const c=$("cal");c.hidden=!c.hidden;this.classList.toggle("open",!c.hidden)};
function tab(n){["1","2","3"].forEach(k=>{$("v"+k).hidden=k!=n;$("t"+k).classList.toggle("on",k==n)})}
["1","2","3"].forEach(k=>$("t"+k).onclick=()=>tab(k));
build();

/* ===== Mise à jour automatique (API Jolpica / Ergast, gratuite) ===== */
const API="https://api.jolpi.ca/ergast/f1/2026";
async function J(path){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{const r=await fetch(API+path,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(t)}
}
const fd=(d,o)=>new Date(d+"T12:00:00Z").toLocaleDateString("fr-FR",Object.assign({timeZone:"UTC"},o));
const short=d=>fd(d,{day:"numeric",month:"short"});
const long=d=>fd(d,{day:"numeric",month:"long",year:"numeric"});
const fullName=d=>N[d.code]||((d.givenName+" "+d.familyName).replace(/^Andrea /,""));
async function live(){
  const st=await J("/driverStandings.json");
  const L=st.MRData.StandingsTable.StandingsLists[0];
  if(!L||!L.DriverStandings||!L.DriverStandings.length)throw new Error("vide");
  const round=+L.round;
  const sc=await J("/races.json?limit=40");
  const races=sc.MRData.RaceTable.Races;
  const frn=r=>FR[+r.round]||r.raceName.replace(/ Grand Prix.*/,"");
  const drivers=L.DriverStandings.map(x=>{
    const n=fullName(x.Driver);N[x.Driver.code]=n;
    const team=tname(x.Constructors[x.Constructors.length-1].name);
    ID[n]=x.Driver.driverId;CID[team]=x.Constructors[x.Constructors.length-1].constructorId;
    return [n,team,+x.points]});
  // résultats des manches pas encore connues
  const res=RES.slice(0,round),rows=RACES.slice(0,round);
  for(let r=1;r<=round;r++){
    if(res[r-1]&&rows[r-1])continue;
    const rr=await J("/"+r+"/results.json?limit=40");
    const R=rr.MRData.RaceTable.Races[0];if(!R)continue;
    const ok=[],ko=[];
    R.Results.forEach(x=>{const c=x.Driver.code||x.Driver.driverId.slice(0,3).toUpperCase();
      N[c]=fullName(x.Driver);TEAM[N[c]]=tname(x.Constructor.name);
      (/^\d+$/.test(x.positionText)?ok:ko).push(c)});
    res[r-1]=ok.join(" ")+(ko.length?" | "+ko.join(" "):"");
    const w=R.Results[0],wn=N[w.Driver.code]||fullName(w.Driver);
    rows[r-1]=[frn(R),short(R.date),wn,tname(w.Constructor.name)];
  }
  // pour les manches déjà connues, on garde les données intégrées
  for(let r=1;r<=round;r++){if(!rows[r-1])rows[r-1]=RACES[r-1]}
  drivers.forEach(d=>TEAM[d[0]]=d[1]);
  const up=races.filter(r=>+r.round>round).map(r=>[frn(r),short(r.date)]);
  const last=races.find(r=>+r.round===round),nxt=races.find(r=>+r.round===round+1);
  DATA={round,total:races.length,after:"GP "+frn(last),date:long(last.date),
    next:nxt?frn(nxt):"Saison terminée",nextDate:nxt?long(nxt.date):"",drivers};
  TOTAL=races.length;RACES=rows;RES=res;UP=up;
  build();
  const f=document.querySelector(".foot");
  f.textContent="Données en direct ✓ · actualisées à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
live().catch(()=>{document.querySelector(".foot").textContent="Hors connexion : dernières données intégrées affichées."});

/* ===== Fiche pilote : historique + photo ===== */
const PH={};
const WT={"Kimi Antonelli":"Andrea Kimi Antonelli","George Russell":"George Russell (racing driver)","Carlos Sainz":"Carlos Sainz Jr.","Alex Albon":"Alexander Albon","Raúl Fernández":"Raúl Fernández (motorcyclist)","Jack Miller":"Jack Miller (motorcyclist)"};
const ini=n=>n.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function avHTML(n,col){return PH[n]?`<img alt="" referrerpolicy="no-referrer" src="${PH[n]}">`:ini(n)}
function hist(name){
  const code=Object.keys(N).find(k=>N[k]===name),team=TEAM[name]||"",col=COL[team]||"#888";
  const di=DATA.drivers.findIndex(d=>d[0]===name),pts=di>=0?DATA.drivers[di][2]:0;
  let w=0,pod=0,t5=0,fin=0,dnf=0,ent=0,sum=0,best=0;const chips=[];
  RES.forEach((s,i)=>{
    const g=(RACES[i]&&RACES[i][0])||"";let k=-1,x=false;
    if(s){const p=s.split("|").map(z=>z.trim().split(" ").filter(Boolean));k=p[0].indexOf(code);x=(p[1]||[]).includes(code)}
    let cls="",v="–";
    if(k>=0){const r=k+1;ent++;fin++;sum+=r;if(!best||r<best)best=r;if(r===1)w++;if(r<=3)pod++;if(r<=5)t5++;v=r;cls=r===1?"w":r<=3?"p":""}
    else if(x){ent++;dnf++;v="✕";cls="x"}
    else cls="n";
    chips.push(`<span class="ch ${cls}" title="GP ${g}"><i>${g.slice(0,3).toUpperCase()}</i>${v}</span>`)});
  const st=[[di+1+"e","Classement"],[pts,"Points"],[w,"Victoires"],[pod,"Podiums"],[t5,"Top 5"],[dnf,"Abandons / NC"],[ent,"Courses"],[best?best+"e":"–","Meilleur résultat"],[fin?(sum/fin).toFixed(1):"–","Position moy."]];
  return `<div class="dhead"><div class="av" data-n="${name}" style="background:${col}">${avHTML(name)}</div><div><div class="dn">${name}</div><div class="ds">${team} · Saison 2026</div></div></div><div class="st">${st.map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join("")}</div><div class="chs">${chips.join("")}</div><div class="lg">Résultat de chaque Grand Prix (ordre de la saison). Or : victoire · gris : podium · ✕ : abandon ou non classé · – : absent.</div><div class="lg">Photo : Wikipédia (si disponible).</div>${carBlock("d",ID[name])}`;
}
async function photo(name){
  if(name in PH)return;PH[name]=null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent((WT[name]||name).replace(/ /g,"_")));
    if(!r.ok)return;const j=await r.json();
    if(j.type!=="standard"||!j.thumbnail||!/racing|driver|rider|motorcycl|motorsport|formula/i.test((j.description||"")+" "+(j.extract||"").slice(0,250)))return;
    PH[name]=j.thumbnail.source;
    document.querySelectorAll(".av").forEach(a=>{if(a.dataset.n===name)a.innerHTML=avHTML(name)});
  }catch(e){}
}
document.getElementById("list").addEventListener("click",e=>{
  const r=e.target.closest(".drv");if(!r||e.target.closest(".dh"))return;
  const n=r.dataset.n;
  if(OPEN.has(n)){OPEN.delete(n);r.classList.remove("open");return}
  OPEN.add(n);r.querySelector(".dh").innerHTML=hist(n);r.classList.add("open");photo(n);loadCareer("d",ID[n]);
});

/* ===== Fiche équipe : historique ===== */
function thist(team){
  const col=COL[team]||"#888",codes=Object.keys(N).filter(k=>TEAM[N[k]]===team);
  const T={};DATA.drivers.forEach(d=>T[d[1]]=(T[d[1]]||0)+d[2]);
  const TL=Object.entries(T).sort((a,b)=>b[1]-a[1]),rk=TL.findIndex(x=>x[0]===team)+1,pts=T[team]||0;
  let w=0,pod=0,t5=0,dnf=0,ent=0,best=0;const chips=[],per={};
  codes.forEach(c=>per[c]={w:0,pod:0,dnf:0,ent:0});
  RES.forEach((s,i)=>{
    const g=(RACES[i]&&RACES[i][0])||"";let b=0,any=false;
    if(s){const p=s.split("|").map(z=>z.trim().split(" ").filter(Boolean));
      codes.forEach(c=>{const k=p[0].indexOf(c);
        if(k>=0){const r=k+1;any=true;ent++;per[c].ent++;if(!b||r<b)b=r;if(r<=3){pod++;per[c].pod++}if(r<=5)t5++;if(r===1)per[c].w++}
        else if((p[1]||[]).includes(c)){any=true;ent++;dnf++;per[c].ent++;per[c].dnf++}})}
    let cls="n",v="–";
    if(b){v=b;cls=b===1?"w":b<=3?"p":"";if(b===1)w++;if(!best||b<best)best=b}
    else if(any){v="✕";cls="x"}
    chips.push(`<span class="ch ${cls}" title="GP ${g}"><i>${g.slice(0,3).toUpperCase()}</i>${v}</span>`)});
  const st=[[rk+"e","Classement"],[pts,"Points"],[w,"Victoires"],[pod,"Podiums (pilotes)"],[t5,"Top 5 (pilotes)"],[dnf,"Abandons / NC"],[ent,"Départs (pilotes)"],[best?best+"e":"–","Meilleur résultat"],[DATA.drivers.filter(d=>d[1]===team).length,"Pilotes"]];
  const dr=DATA.drivers.filter(d=>d[1]===team).map(d=>{const c=Object.keys(N).find(k=>N[k]===d[0]),q=per[c]||{w:0,pod:0,dnf:0,ent:0};
    return `<div class="rr" style="grid-template-columns:1fr auto"><span>${d[0]}</span><span class="rt">${d[2]} pts · ${q.w} vict. · ${q.pod} pod. · ${q.dnf} aband./NC</span></div>`}).join("");
  return `<div class="dhead"><div class="av" style="background:${col}">${ini(team)}</div><div><div class="dn">${team}</div><div class="ds">Saison 2026</div></div></div><div class="st">${st.map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join("")}</div><div class="ds" style="margin-bottom:6px">Détail par pilote</div>${dr}<div class="ds" style="margin:10px 0 6px">Meilleur résultat de l'équipe à chaque Grand Prix</div><div class="chs">${chips.join("")}</div><div class="lg">Or : victoire · gris : podium · ✕ : abandon ou non classé · – : absent. Les pilotes sont rattachés à leur équipe actuelle ; « Victoires » compte les courses gagnées par l'équipe.</div>${carBlock("c",CID[team])}`;
}
document.getElementById("cons").addEventListener("click",e=>{
  const r=e.target.closest(".tm");if(!r||e.target.closest(".dh"))return;
  const k="T:"+r.dataset.t;
  if(OPEN.has(k)){OPEN.delete(k);r.classList.remove("open");return}
  OPEN.add(k);r.querySelector(".dh").innerHTML=thist(r.dataset.t);r.classList.add("open");loadCareer("c",CID[r.dataset.t]);
});

/* ===== Carrière : toutes les saisons (API Jolpica, chargée à l'ouverture de la fiche) ===== */
const ID={},CID={},CAR={},INF={};
const TITD={hamilton:[2008,2014,2015,2017,2018,2019,2020],max_verstappen:[2021,2022,2023,2024],alonso:[2005,2006],norris:[2025]};
const TITC={ferrari:[1961,1964,1975,1976,1977,1979,1982,1983,1999,2000,2001,2002,2003,2004,2007,2008],mclaren:[1974,1984,1985,1988,1989,1990,1991,1998,2024,2025],mercedes:[2014,2015,2016,2017,2018,2019,2020,2021],red_bull:[2010,2011,2012,2013,2022,2023],williams:[1980,1981,1986,1987,1992,1993,1994,1996,1997]};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jt(p){
  await sleep(280);
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch("https://api.jolpi.ca/ergast/f1"+p,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function career(kind,id){
  const base=(kind==="c"?"/constructors/":"/drivers/")+id;
  const R=await jt(base+"/results/1.json?limit=100");
  const wins=+R.MRData.total;let races=R.MRData.RaceTable.Races.slice();
  while(races.length<wins&&races.length%100===0){
    const M=await jt(base+"/results/1.json?limit=100&offset="+races.length);
    const x=M.MRData.RaceTable.Races;if(!x.length)break;races=races.concat(x)}
  const by={};races.forEach(r=>by[r.season]=(by[r.season]||0)+1);
  let p2=0,p3=0;
  if(kind!=="c"){p2=+(await jt(base+"/results/2.json?limit=1")).MRData.total;p3=+(await jt(base+"/results/3.json?limit=1")).MRData.total}
  const poles=+(await jt(base+"/grid/1/results.json?limit=1")).MRData.total;
  const starts=+(await jt(base+"/results.json?limit=1")).MRData.total;
  const seasons=(await jt(base+"/seasons.json?limit=100")).MRData.SeasonTable.Seasons.map(x=>+x.season);
  return {wins,pod:wins+p2+p3,poles,starts,seasons,by,titles:((kind==="c"?TITC:TITD)[id]||[])};
}
function carHTML(kind,id){
  const k=kind+":"+id,d=CAR[k];
  if(!id)return "Statistiques de carrière disponibles dès que les données en direct sont chargées (connexion nécessaire).";
  if(d==="err")return "Statistiques de carrière indisponibles pour le moment (connexion ?). Refermez puis rouvrez la fiche pour réessayer.";
  if(!d)return "Chargement des statistiques de carrière…";
  const T=kind==="c";
  const st=T?[[d.titles.length,"Titres constructeurs"],[d.wins,"Victoires"],[d.poles,"Pole positions"],[d.seasons.length,"Saisons"],[d.starts,"Départs (voitures)"],[d.seasons.length?d.seasons[0]:"–","Première saison"]]
    :[[d.titles.length,"Titres mondiaux"],[d.wins,"Victoires"],[d.pod,"Podiums"],[d.poles,"Pole positions"],[d.starts,"Courses"],[d.seasons.length,"Saisons"]];
  const yrs=d.seasons.map(y=>{const w=d.by[y]||0,t=d.titles.includes(y);return `<span class="ch ${t?"w":w?"p":"n"}" title="${y} : ${w} victoire(s)${t?" · titre":""}"><i>${y}</i>${w}${t?"★":""}</span>`}).join("");
  return `<div class="st">${st.map(a=>`<div><b>${a[0]}</b>${a[1]}</div>`).join("")}</div><div class="chs">${yrs}</div><div class="lg">Victoires par saison (★ : saison du titre mondial). Source : base Jolpica/Ergast. ${T?"Les équipes rebaptisées (ex. Renault → Alpine) sont comptées séparément. ":""}Les titres sont une liste fixe ; ceux de la saison en cours ne sont pas inclus.</div>`;
}
function carBlock(kind,id){
  return `<div class="ds" style="margin:12px 0 6px">Carrière (toutes les saisons)</div><div class="cr" data-k="${kind}:${id}">${carHTML(kind,id)}</div>`;
}
function carUpd(k){const [kind,id]=k.split(":");document.querySelectorAll(".cr").forEach(e=>{if(e.dataset.k===k)e.innerHTML=carHTML(kind,id)})}
async function loadCareer(kind,id){
  if(!id)return;const k=kind+":"+id;
  if(CAR[k]&&CAR[k]!=="err"||INF[k])return;
  try{const o=JSON.parse(localStorage.getItem("car2:"+k)||"null");if(o&&Date.now()-o.t<864e5){CAR[k]=o.d;carUpd(k);return}}catch(e){}
  INF[k]=1;
  try{CAR[k]=await career(kind,id);try{localStorage.setItem("car2:"+k,JSON.stringify({t:Date.now(),d:CAR[k]}))}catch(e){}}
  catch(e){CAR[k]="err"}
  INF[k]=0;carUpd(k);
}
</script>
