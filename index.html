<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement pilotes F1 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f7;--card:#fff;--tx:#15151e;--mut:#6b6b78;--line:#e4e4ea;--acc:#e10600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}}
:root[data-theme="dark"]{--bg:#111116;--card:#1b1b23;--tx:#f2f2f5;--mut:#9a9aa8;--line:#2a2a35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.next b{color:var(--acc)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:12px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pos{font-weight:700;font-size:16px;text-align:center}
.name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.team{color:var(--mut);font-size:12px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.pts{text-align:right;font-weight:700;font-size:18px}
.gap{color:var(--mut);font-size:11px;font-weight:400;display:block}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 14px system-ui,sans-serif;padding:9px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.race{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rd{color:var(--mut);font-weight:700;font-size:13px;text-align:center}
.gp{font-weight:600;font-size:15px}
.dt{color:var(--mut);font-size:12px}
.win{text-align:right;font-size:14px;font-weight:600}
.win small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.foot{color:var(--mut);font-size:12px;margin:14px 0 6px;text-align:center}
</style>
</head>
<body>
<h1>🏁 Classement pilotes <span>F1 2026</span></h1>
<p class="sub" id="sub"></p>
<div class="next"><span>Prochain GP : <b id="nx"></b></span><span id="nd"></span></div>
<div class="tabs"><button id="t1" class="on">Classement</button><button id="t2">Courses</button></div>
<div id="v1"><input id="q" type="search" placeholder="Rechercher un pilote ou une écurie…">
<div id="list"></div></div>
<div id="v2" hidden><div id="races"></div></div>
<p class="foot">Mis à jour après chaque Grand Prix.</p>
<script>
const DATA={
  round:16, total:23, after:"Grand Prix de Bahreïn (Sepang)", date:"4 octobre 2026",
  next:"Singapour", nextDate:"11 octobre 2026",
  drivers:[
    ["Kimi Antonelli","Mercedes",320],["George Russell","Mercedes",236],
    ["Lewis Hamilton","Ferrari",214],["Charles Leclerc","Ferrari",191],
    ["Lando Norris","McLaren",188],["Max Verstappen","Red Bull",188],
    ["Oscar Piastri","McLaren",128],["Isack Hadjar","Red Bull",96],
    ["Liam Lawson","Racing Bulls",65],["Pierre Gasly","Alpine",41],
    ["Arvid Lindblad","Racing Bulls",38],["Franco Colapinto","Alpine",27],
    ["Oliver Bearman","Haas",20],["Gabriel Bortoleto","Audi",10],
    ["Nico Hülkenberg","Audi",7],["Esteban Ocon","Haas",7],
    ["Fernando Alonso","Aston Martin",7],["Carlos Sainz","Williams",7],
    ["Alex Albon","Williams",5],["Yuki Tsunoda","Racing Bulls",1],
    ["Lance Stroll","Aston Martin",0],["Valtteri Bottas","Cadillac",0],
    ["Sergio Pérez","Cadillac",0]
  ]
};
const COL={"Mercedes":"#27f4d2","Ferrari":"#e8002d","McLaren":"#ff8000","Red Bull":"#3671c6","Racing Bulls":"#6692ff","Alpine":"#ff87bc","Haas":"#b6babd","Audi":"#c0392b","Aston Martin":"#229971","Williams":"#64c4ff","Cadillac":"#8a8a99"};
document.getElementById("sub").textContent="Après la manche "+DATA.round+"/"+DATA.total+" · "+DATA.after+" · "+DATA.date;
document.getElementById("nx").textContent=DATA.next;
document.getElementById("nd").textContent=DATA.nextDate;
const max=DATA.drivers[0][2];
function render(f){
  const t=(f||"").toLowerCase();
  document.getElementById("list").innerHTML=DATA.drivers.map((d,i)=>{
    if(t&&!(d[0]+" "+d[1]).toLowerCase().includes(t))return"";
    const c=COL[d[1]]||"#888",gap=i?"−"+(max-d[2])+" pts":"Leader";
    return `<div class="row"><div class="pos">${i+1}</div><div><div class="name"><span class="dot" style="background:${c}"></span>${d[0]}</div><div class="team">${d[1]}</div><div class="bar"><i style="width:${d[2]/max*100}%;background:${c}"></i></div></div><div class="pts">${d[2]}<span class="gap">${gap}</span></div></div>`;
  }).join("");
}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render();
const RACES=[
["Australie","8 mars","George Russell","Mercedes"],["Chine","15 mars","Kimi Antonelli","Mercedes"],
["Japon","29 mars","Kimi Antonelli","Mercedes"],["Miami","3 mai","Kimi Antonelli","Mercedes"],
["Canada","24 mai","Kimi Antonelli","Mercedes"],["Monaco","7 juin","Kimi Antonelli","Mercedes"],
["Barcelone-Catalogne","14 juin","Lewis Hamilton","Ferrari"],["Autriche","28 juin","George Russell","Mercedes"],
["Grande-Bretagne","5 juil.","Charles Leclerc","Ferrari"],["Belgique","19 juil.","Kimi Antonelli","Mercedes"],
["Hongrie","26 juil.","Lando Norris","McLaren"],["Pays-Bas","23 août","Lando Norris","McLaren"],
["Italie","6 sept.","Kimi Antonelli","Mercedes"],["Espagne","13 sept.","Kimi Antonelli","Mercedes"],
["Azerbaïdjan","26 sept.","George Russell","Mercedes"],["Bahreïn (Sepang)","4 oct.","Max Verstappen","Red Bull"]
];
document.getElementById("races").innerHTML=RACES.map((r,i)=>{const c=COL[r[3]]||"#888";
return `<div class="race"><div class="rd">${i+1}</div><div><div class="gp">GP ${r[0]}</div><div class="dt">${r[1]} 2026</div></div><div class="win"><span class="dot" style="background:${c};display:inline-block;margin-right:5px"></span>${r[2]}<small>${r[3]}</small></div></div>`}).join("");
function tab(n){["1","2"].forEach(k=>{document.getElementById("v"+k).hidden=k!=n;document.getElementById("t"+k).classList.toggle("on",k==n)})}
document.getElementById("t1").onclick=()=>tab("1");
document.getElementById("t2").onclick=()=>tab("2");
</script>
</body>
</html>
